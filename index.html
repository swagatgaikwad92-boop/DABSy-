<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#030407"
  >

  <meta
    name="description"
    content="D.A.B.s.y. Your digital creature, butler and study partner."
  >

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">

  <title>D.A.B.s.y</title>
</head>

<body>

  <!--
    ============================================================
    D.A.B.s.y
    The creature lives here.
    Keep this DOM intentionally small.
    ============================================================
  -->

  <main id="dabsyWorld" class="dabsy-world">

    <!-- Atmospheric presence -->
    <div class="atmosphere" aria-hidden="true">
      <div class="atmosphere-core"></div>
      <div class="atmosphere-haze"></div>
    </div>

    <!-- ======================================================
         CREATURE
         ====================================================== -->

    <section
      id="dabsyCreature"
      class="creature"
      aria-label="D.A.B.s.y"
    >

      <div class="creature-shadow"></div>

      <div class="face" id="dabsyFace">

        <!-- LEFT EYE -->
        <div
          class="eye eye-left"
          data-eye="left"
        >
          <div class="eye-depth"></div>
          <div class="eye-shell"></div>
          <div class="eye-light"></div>
          <div class="eye-focus"></div>
          <div class="eye-highlight"></div>
          <div class="eye-atmosphere"></div>
        </div>

        <!-- RIGHT EYE -->
        <div
          class="eye eye-right"
          data-eye="right"
        >
          <div class="eye-depth"></div>
          <div class="eye-shell"></div>
          <div class="eye-light"></div>
          <div class="eye-focus"></div>
          <div class="eye-highlight"></div>
          <div class="eye-atmosphere"></div>
        </div>

      </div>

      <!-- Tiny physical hints of the creature -->
      <div class="hand hand-left" id="leftHand"></div>
      <div class="hand hand-right" id="rightHand"></div>

    </section>


    <!-- ======================================================
         SPEECH
         Appears only when D.A.B.s.y actually communicates.
         ====================================================== -->

    <div
      id="dialogue"
      class="dialogue"
      aria-live="polite"
    >
      <div id="speech" class="speech"></div>
    </div>


    <!-- ======================================================
         WORLD
         ====================================================== -->

    <section
      id="dabsyEnvironment"
      class="environment"
      aria-hidden="true"
    >

      <div class="world-layer world-back"></div>

      <div class="world-object schedule-object">
        <span>today</span>
      </div>

      <div class="world-object study-object">
        <span>study</span>
      </div>

      <div class="world-object memory-object">
        <span>memory</span>
      </div>

      <div class="world-object project-object">
        <span>projects</span>
      </div>

      <div class="world-layer world-front"></div>

    </section>


    <!-- ======================================================
         STUDY / BUTLER CONTENT
         ====================================================== -->

    <section
      id="contentArea"
      class="content-space"
      aria-hidden="true"
    >
      <div class="content-inner">

        <div
          id="contentTitle"
          class="content-title"
        ></div>

        <div
          id="contentText"
          class="content-text"
        ></div>

      </div>
    </section>


    <!-- ======================================================
         SETTINGS
         Hidden until deliberately requested.
         ====================================================== -->

    <aside
      id="settingsPanel"
      class="settings-panel"
      aria-hidden="true"
    >

      <div class="settings-card">

        <button
          id="closeSettings"
          class="settings-close"
          type="button"
          aria-label="Close settings"
        >
          ×
        </button>

        <h2>D.A.B.s.y</h2>

        <p class="settings-subtitle">
          Connect the brain.
        </p>

        <label for="apiKeyInput">
          Gemini API key
        </label>

        <input
          id="apiKeyInput"
          type="password"
          autocomplete="off"
          placeholder="Paste your key"
        >

        <button
          id="saveKey"
          type="button"
          class="settings-save"
        >
          Connect
        </button>

        <p
          id="keyStatus"
          class="key-status"
        ></p>

      </div>

    </aside>


    <!-- Invisible interaction surface -->
    <div
      id="interactionSurface"
      class="interaction-surface"
      aria-hidden="true"
    ></div>

  </main>


  <!-- ========================================================
       CORE
       ======================================================== -->

  <script src="core/motion-engine.js"></script>
  <script src="core/expression-engine.js"></script>
  <script src="core/state-machine.js"></script>
  <script src="core/attention-engine.js"></script>
  <script src="core/interaction-engine.js"></script>
  <script src="core/dabsy-core.js"></script>

  <!-- ========================================================
       AI
       ======================================================== -->

  <script src="ai/personality.js"></script>
  <script src="ai/behaviour-bridge.js"></script>
  <script src="ai/gemini.js"></script>

  <!-- ========================================================
       SYSTEMS
       ======================================================== -->

  <script src="systems/voice.js"></script>
  <script src="systems/memory.js"></script>
  <script src="systems/butler.js"></script>
  <script src="systems/study.js"></script>

  <!-- ========================================================
       WORLD
       ======================================================== -->

  <script src="world/world.js"></script>

  <!-- ========================================================
       BOOT
       ======================================================== -->

  <script src="app.js"></script>

</body>
    </html>
